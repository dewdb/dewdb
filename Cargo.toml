[package]
name = "dewdb"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
crc32fast = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
bincode = "1"
reqwest = { version = "0.12", features = ["json"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
futures = "0.3"